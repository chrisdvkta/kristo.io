<!DOCTYPE html>
<html lang="{{- site.Language.Lang -}}">
    <head>
        {{- partial "head.html" . -}}
    </head>
    <body>
        <div class="site-shell">
            <header class="site-header">
                {{- partial "header.html" . -}}
            </header>

            <main class="site-main" id="main">
                {{- block "main" . }}{{- end }}
            </main>

            <footer class="site-footer">
                {{- partial "footer.html" . -}}
            </footer>
        </div>
    </body>
</html>
